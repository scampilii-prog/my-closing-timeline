name: Deploy CLEAN BUILD preview

on:
  push:
    branches:
      - clean-rebuild-20261103
    paths:
      - 'clean-project/**'
      - '.github/workflows/deploy-clean-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mct-clean-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy isolated Cloudflare Worker preview
    runs-on: ubuntu-latest
    environment: clean-preview
    steps:
      - name: Check out CLEAN BUILD branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview target and credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN secret in the clean-preview environment"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID secret in the clean-preview environment"; exit 1; }
          node -e "const c=require('./clean-project/wrangler.json');if(c.name!=='mct-clean-preview-20261103')process.exit(1);if(c.assets?.directory!=='./')process.exit(1)"
      - name: Deploy preview (never production)
        working-directory: clean-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy
