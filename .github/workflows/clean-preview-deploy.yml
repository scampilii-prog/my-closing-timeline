name: Deploy CLEAN preview only (never production)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/clean-rebuild-20261103'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated worker target
        run: |
          node -e "const c=require('./clean-project/wrangler-preview.json');if(c.name!=='mct-clean-preview-20261103'||c.assets.directory!=='./')process.exit(1)"
      - name: Check preview-only credentials are available
        env:
          CF_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_PREVIEW_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Configure CF_PREVIEW_API_TOKEN and CF_PREVIEW_ACCOUNT_ID for isolated preview. No deployment attempted."
            exit 1
          fi
      - name: Publish isolated Workers preview
        working-directory: clean-project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PREVIEW_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler-preview.json
      - name: Wait for Workers assets to become available
        run: sleep 8
      - name: Verify deployed preview matches branch
        env:
          MCT_PREVIEW_URL: https://mct-clean-preview-20261103.${{ secrets.CF_PREVIEW_SUBDOMAIN }}.workers.dev
        run: |
          if [ -z "${{ secrets.CF_PREVIEW_SUBDOMAIN }}" ]; then
            echo "::error::CF_PREVIEW_SUBDOMAIN is required to verify the deployed version; no success claim without verification."
            exit 1
          fi
          node clean-project/verify-preview.cjs
